spring.application.name=webportfolio

# hinter einem Reverse-Proxy (HTTPS) die echten Header auswerten
server.forward-headers-strategy=framework

# kleinere Antworten, Browser-Cache fuer statische Dateien (danach per ETag revalidieren)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024
spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.cache.cachecontrol.cache-public=true
