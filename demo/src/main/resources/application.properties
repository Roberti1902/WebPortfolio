spring.application.name=webportfolio

# hinter einem Reverse-Proxy (HTTPS) die echten Header auswerten
server.forward-headers-strategy=framework

# kleinere Antworten (Caching uebernimmt auf IONOS die .htaccess)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024
