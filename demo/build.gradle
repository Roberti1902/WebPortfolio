plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Statische Website fuer das IONOS-Webhosting erzeugen: build/site -> nach htdocs hochladen
tasks.register('exportSite', JavaExec) {
	group = 'build'
	description = 'Rendert alle Seiten als statisches HTML nach build/site (Upload nach IONOS htdocs)'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.demo.SiteExporter'
	args = [layout.buildDirectory.dir('site').get().asFile.path, projectDir.path]
}
